#when defining properties it is better we use format ${"ENV":here the value}
#here env can be anything variable name

spring.application.name=springsecsection1

#her we we have to mention all profiles that we have created
spring.config.import=application_prod.properties
#here mention which profile should be active, we can mention in envirmenetal variable also if both mentioned then env variable is considered (here even though i mentioned default, prod is active because in env I mentioned prod)
spring.profiles.active=default

spring.datasource.url=jdbc:mysql://localhost:3307/eazyBankProjectSpringSecurity

#we can give like below but then when we push into git the database usename and password will be seen to all so just use the line below the next line and mention the value in a env file
#spring.datasource.username=${DB_USERNAME:root}
spring.datasource.username=${DB_USERNAME}

#spring.datasource.password=${DB_PASSWORD:Kaetr2Cqnv1@1}
spring.datasource.password=${DB_PASSWORD}

logging.level.org.springframework.security=ERROR

spring.servlet.session.timeout=${SESSION_TIMEOUT:20m}

