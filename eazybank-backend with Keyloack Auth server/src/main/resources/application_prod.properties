#when defining properties it is better we use format ${"ENV":here the value}
#here env can be anything variable name

spring.application.name=springsecsection1

spring.datasource.url=jdbc:mysql://localhost:3307/eazyBankProjectSpringSecurity

#we can give like below but then when we push into git the database usename and password will be seen to all so just use the line below the next line and mention the value in a env file
#spring.datasource.username=${DB_USERNAME:root}
spring.datasource.username=${DB_USERNAME}

#spring.datasource.password=${DB_PASSWORD:Kaetr2Cqnv1@1}
spring.datasource.password=${DB_PASSWORD}

logging.level.org.springframework.security=ERROR

#this tells if prod profile is activated then this property file should run
spring.config.activate.on-profile=prod

spring.servlet.session.timeout=${SESSION_TIMEOUT:10m}

#it acts as jwt decoder (used by resourse server to decode the jwt token(access token) sent by client)
#we get the below url from keycloak website (open releam settings and then scroll down open endpoints)
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8180/realms/eazybankdev/protocol/openid-connect/certs